<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新增沟通记录 · 示例</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#cbd8e4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1a2733}.phone{position:relative;width:390px;height:844px;overflow:hidden;border-radius:26px;background:linear-gradient(155deg,#f3f8fc 0%,#e6eff8 52%,#d6e5f2 100%);box-shadow:0 28px 80px rgba(39,68,94,.2);padding:14px 20px}.status{display:flex;justify-content:space-between;font-size:11px;font-weight:600}.top{height:64px;display:flex;align-items:center;gap:14px}.back{font-size:30px}.top h1{font-size:23px;margin:0;flex:1}.more{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.85)}.seg{height:40px;padding:4px;border-radius:14px;background:#d8e5ef;display:grid;grid-template-columns:1fr 1fr;font-size:12px}.seg span{display:grid;place-items:center;color:#6d7d8b}.seg .active{border-radius:11px;background:rgba(255,255,255,.9);color:#1a2733}.glass{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);box-shadow:0 16px 38px rgba(26,50,72,.07);backdrop-filter:blur(26px);border-radius:22px}.assoc{margin-top:18px;height:114px;padding:14px 16px}.label{font-size:10px;color:#6d7d8b;font-weight:600}.customer{display:flex;align-items:center;margin-top:10px}.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e7f1f8;font-size:10px}.who{margin-left:12px;line-height:1.3}.who b{font-size:14px}.who small{display:block;color:#6d7d8b;font-size:10px}.change{margin-left:auto;color:#6986a3;font-size:10px}.business{border-top:1px solid #c5d3df;margin-top:10px;padding-top:8px;display:flex;align-items:center;gap:8px}.chip{font-size:10px;border-radius:15px;padding:7px 12px;background:#fff;border:1px solid #c5d3df}.chip.on{background:#6986a3;color:#fff;border-color:#6986a3}.form{margin-top:18px;height:410px;padding:14px 16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.input{margin-top:6px;border-radius:12px;border:1px solid #d1dee8;background:#f8fbfd;min-height:42px;padding:11px 12px;font-size:12px}.avatars{display:flex;align-items:center;gap:5px;margin-top:8px}.avatars small{color:#6d7d8b;font-size:10px;margin-right:12px}.textarea{min-height:66px;line-height:1.55}.attach{margin-top:16px;height:52px;padding:9px 14px;display:flex;align-items:center}.plus{width:32px;height:32px;border-radius:50%;background:#e5eef5;display:grid;place-items:center;color:#6986a3;font-size:17px}.attach-copy{margin-left:12px}.attach-copy b{font-size:12px}.attach-copy small{display:block;font-size:9px;color:#6d7d8b;margin-top:3px}.actions{position:absolute;left:20px;right:20px;bottom:24px;height:48px;display:grid;grid-template-columns:108px 1fr;gap:10px}.btn{border:0;border-radius:16px;font:600 13px inherit}.secondary{background:rgba(255,255,255,.72);color:#1a2733;border:1px solid rgba(255,255,255,.9)}.primary{background:#6986a3;color:#fff;position:relative}.dot{width:9px;height:9px;border-radius:50%;background:#c4ff62;display:inline-block;margin-right:8px;box-shadow:0 0 10px rgba(196,255,98,.55)}
  </style>
</head>
<body>
  <main class="phone">
    <div class="status"><span>9:41</span><span>●●● 5G ▰</span></div>
    <header class="top"><span class="back">‹</span><h1>新增沟通记录</h1><span class="more">···</span></header>
    <div class="seg"><span class="active">手工录入</span><span>AI 整理材料</span></div>
    <section class="glass assoc"><div class="label">关联客户 *</div><div class="customer"><span class="avatar">华</span><span class="who"><b>华东智造科技</b><small>王磊 · 采购总监</small></span><span class="change">更换 ›</span></div><div class="business"><span class="label">业务线</span><span class="chip on">制造业务</span><span class="chip">数字化服务</span></div></section>
    <section class="glass form">
      <div class="row"><div class="field"><div class="label">沟通时间 *</div><div class="input">8月21日 14:20</div></div><div class="field"><div class="label">渠道 *</div><div class="input">电话 ⌄</div></div></div>
      <div class="field"><div class="label">双方参与人 *</div><div class="avatars"><span class="avatar">张</span><span class="avatar">李</span><small>我方 2 人</small><span class="avatar">王</span><span class="avatar">+</span><small>客户方 1 人</small></div></div>
      <div class="field"><div class="label">主题 *</div><div class="input">实施周期与报价方案沟通</div></div>
      <div class="field"><div class="label">沟通内容 *</div><div class="input textarea">客户认可初步方案，希望补充实施周期、交付边界和正式报价。</div></div>
      <div class="field"><div class="label">结论 / 后续推进</div><div class="input">双方确认下周继续沟通具体实施安排。</div></div>
    </section>
    <section class="glass attach"><span class="plus">+</span><span class="attach-copy"><b>添加附件</b><small>PDF / 图片 / 文档，最多 10 个</small></span></section>
    <footer class="actions"><button class="btn secondary">保存草稿</button><button class="btn primary"><span class="dot"></span>保存正式记录</button></footer>
  </main>
</body>
</html>
